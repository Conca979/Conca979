<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img" aria-label="Conca979 terminal header">
  <defs>
    <radialGradient id="bhGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#090a0f" stop-opacity="0" />
    </radialGradient>

    <clipPath id="clipLine1">
      <rect class="reveal reveal-1" x="28" y="54" width="520" height="26" />
    </clipPath>
    <clipPath id="clipLine2">
      <rect class="reveal reveal-2" x="28" y="80" width="520" height="26" />
    </clipPath>
    <clipPath id="clipLine3">
      <rect class="reveal reveal-3" x="28" y="116" width="520" height="26" />
    </clipPath>
    <clipPath id="clipLine4">
      <rect class="reveal reveal-4" x="28" y="142" width="540" height="28" />
    </clipPath>

    <style>
      .mono {
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      }
      .title {
        font-size: 12px;
        fill: #8b949e;
      }
      .cmd {
        font-size: 14px;
      }
      .reveal-1 {
        animation: typeIn 0.35s steps(12, end) 0.05s both;
      }
      .reveal-2 {
        animation: typeIn 0.4s steps(36, end) 0.45s both;
      }
      .reveal-3 {
        animation: typeIn 0.35s steps(18, end) 0.9s both;
      }
      .reveal-4 {
        animation: typeIn 0.55s steps(48, end) 1.3s both;
      }
      .cursor {
        animation: blink 1.05s step-end infinite;
      }
      .orbit {
        animation: pulseOrbit 5s ease-in-out infinite;
      }
      @keyframes typeIn {
        from { width: 0px; }
        to { width: 540px; }
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulseOrbit {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) {
        .reveal-1, .reveal-2, .reveal-3, .reveal-4 {
          animation: none;
          width: 540px;
        }
        .cursor, .orbit {
          animation: none;
        }
      }
    </style>
  </defs>

  <!-- Terminal Window -->
  <rect x="1" y="1" width="798" height="208" rx="10" fill="#090a0f" stroke="#1f2638" stroke-width="1.5" />

  <!-- Title Bar -->
  <path d="M 1.75 11 Q 1.75 1.75 11 1.75 H 789 Q 798.25 1.75 798.25 11 V 35 H 1.75 Z" fill="#111420" />
  <line x1="1" y1="35" x2="799" y2="35" stroke="#1f2638" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="22" cy="18" r="5" fill="#f59e0b" fill-opacity="0.85" />
  <circle cx="40" cy="18" r="5" fill="#38bdf8" fill-opacity="0.85" />
  <circle cx="58" cy="18" r="5" fill="#30363d" />

  <!-- Window Title -->
  <text x="400" y="22" text-anchor="middle" class="mono title">conca979@github: ~</text>

  <!-- Cosmic Black-Hole Motif -->
  <circle cx="685" cy="122" r="88" fill="url(#bhGlow)" />
  <g transform="rotate(-18 685 122)">
    <!-- Back half of accretion disk -->
    <ellipse cx="685" cy="122" rx="82" ry="24" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" class="orbit" />
    <ellipse cx="685" cy="122" rx="64" ry="17" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.7" />
  </g>
  <!-- Event horizon -->
  <circle cx="685" cy="122" r="24" fill="#090a0f" stroke="#f59e0b" stroke-width="1.6" stroke-opacity="0.85" />
  <circle cx="685" cy="122" r="20" fill="#090a0f" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.4" />
  <!-- Front accretion arc overlapping the event horizon -->
  <g transform="rotate(-18 685 122)">
    <path d="M 621 122 A 64 17 0 0 0 749 122" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" />
    <path d="M 637 125 A 48 12 0 0 0 733 125" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" stroke-linecap="round" />
  </g>
  <!-- Subtle star markers -->
  <circle cx="602" cy="74" r="1.3" fill="#38bdf8" fill-opacity="0.7" />
  <circle cx="758" cy="70" r="1.5" fill="#f59e0b" fill-opacity="0.7" />
  <circle cx="764" cy="166" r="1.2" fill="#e6edf3" fill-opacity="0.5" />
  <circle cx="614" cy="172" r="1.2" fill="#f59e0b" fill-opacity="0.55" />

  <!-- Terminal Prompt & Whoami Output -->
  <g clip-path="url(#clipLine1)">
    <text x="28" y="72" class="mono cmd">
      <tspan fill="#f59e0b">$</tspan>
      <tspan fill="#38bdf8"> whoami</tspan>
    </text>
  </g>

  <g clip-path="url(#clipLine2)">
    <text x="28" y="98" class="mono cmd">
      <tspan fill="#e6edf3" font-weight="600">Nguyen Tung Duong</tspan>
      <tspan fill="#8b949e"> (Conca979) | student</tspan>
    </text>
  </g>

  <g clip-path="url(#clipLine3)">
    <text x="28" y="134" class="mono cmd">
      <tspan fill="#f59e0b">$</tspan>
      <tspan fill="#38bdf8"> cat</tspan>
      <tspan fill="#8b949e"> ~/.status</tspan>
    </text>
  </g>

  <g clip-path="url(#clipLine4)">
    <text x="28" y="160" class="mono cmd">
      <tspan fill="#e6edf3">from-scratch dl/nlp, ml research, &amp; c systems </tspan>
      <tspan class="cursor" fill="#f59e0b">&#x2588;</tspan>
    </text>
  </g>
</svg>
